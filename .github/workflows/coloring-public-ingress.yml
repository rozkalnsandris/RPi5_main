name: RPi5 #841 Coloring public ingress\n\non:\n  issue_comment:\n    types: [created]\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: rpi5-841-coloring-public-ingress\n  cancel-in-progress: false\n\njobs:\n  authorize:\n    if: github.event.issue.pull_request == null && github.event.issue.number == 841 && startsWith(github.event.comment.body, '/rpi5-841 ')\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    outputs:\n      operation: ${{ steps.auth.outputs.operation }}\n      expected_sha: ${{ steps.auth.outputs.expected_sha }}\n    steps:\n      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0\n        with:\n          ref: ${{ github.sha }}\n          fetch-depth: 1\n          persist-credentials: false\n      - id: auth\n        run: python3 scripts/github_rpi5_841_bridge.py\n\n  ingress:\n    needs: authorize\n    if: needs.authorize.result == 'success'\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0\n        with:\n          ref: ${{ needs.authorize.outputs.expected_sha }}\n          fetch-depth: 1\n          persist-credentials: false\n      - name: Run guarded Coloring Pages ingress operator\n        env:\n          OPERATION: ${{ needs.authorize.outputs.operation }}\n          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}\n          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\n          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}\n          CLOUDFLARE_P1D03_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_P1D03_ACCOUNT_ID }}\n          CLOUDFLARE_P1D03_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D03_READ_API_TOKEN }}\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          umask 077\n          LOG="$RUNNER_TEMP/coloring-841-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"\n          trap 'rm -f -- "$LOG"' EXIT\n          set +e\n          python3 scripts/cloudflare_coloring_ingress.py "$OPERATION" >"$LOG" 2>&1\n          rc=$?\n          set -e\n          if grep -Ev '^[A-Z0-9_]+=[A-Za-z0-9_.:-]+$' "$LOG" | grep -q .; then\n            echo 'operator emitted non-allowlisted evidence' >&2\n            exit 1\n          fi\n          cat "$LOG"\n          exit "$rc"\n