name: Coloring Pages SIMPLE-DEPLOY target source

on:
  pull_request:
    paths:
      - "ops/deploy/simple-deploy-targets-v1.json"
      - "ops/deploy/simple-deploy-compose/coloring-pages-public.yml"
      - "ops/contracts/simple-deploy-host-v1.json"
      - "tests/test-simple-deploy-coloring-pages-target-v1.py"
      - "tests/test-simple-deploy-hermes-tech-target-v1.py"
      - "tests/test-simple-deploy-rozkalns-cv-compat-v1.py"
      - "tests/test-simple-deploy-v1.py"
      - "docs/SIMPLE_DEPLOY_COLORING_PAGES_TARGET_V1.md"
      - ".github/workflows/simple-deploy-coloring-pages-target-source.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Coloring Pages target contract
        run: python3 ./tests/test-simple-deploy-coloring-pages-target-v1.py
      - name: Validate SIMPLE-DEPLOY registry regressions
        run: python3 ./tests/test-simple-deploy-v1.py
