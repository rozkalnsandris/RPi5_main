name: Apply RPi5 Main branding once

on:
  push:
    branches:
      - chore/branding-rpi5-32

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[branding-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/branding-rpi5-32
          fetch-depth: 0
      - name: Add logo to README
        run: |
          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          block = '''<p align="center">
            <img src="assets/branding/project-logo.svg" alt="RPi5 Main logo" width="160">
          </p>

          '''
          if 'assets/branding/project-logo.svg' not in text:
              readme.write_text(block + text, encoding='utf-8')
          Path('.github/workflows/apply-branding-once.yml').unlink()
          PY
      - name: Commit repository branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add RPi5 Main project branding (#32) [branding-applied]"
          git push origin HEAD:chore/branding-rpi5-32
