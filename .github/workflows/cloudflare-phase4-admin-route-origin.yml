name: Phase 4 ADMIN route origin GET-only

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  actions: read

concurrency:
  group: phase4-admin-route-origin-getonly
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact owner Phase 4 route command
    if: github.event.issue.pull_request == null && github.event.issue.number == 819 && startsWith(github.event.comment.body, '/rpi5-p4-route-origin ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      expected_sha: ${{ steps.authorize.outputs.expected_sha }}
      canary: ${{ steps.authorize.outputs.canary }}

    steps:
      - name: Checkout default-branch authorizer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact owner command
        id: authorize
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/github_phase4_admin_route_origin_bridge.py

  audit:
    name: Run Phase 4 ADMIN route origin GET-only audit
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact authorized main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.authorize.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run exact GET-only route origin audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PHASE4_EXPECTED_SHA: ${{ needs.authorize.outputs.expected_sha }}
          PHASE4_ROUTE_CANARY: ${{ needs.authorize.outputs.canary }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 scripts/cloudflare_phase4_admin_route_origin_actions.py
