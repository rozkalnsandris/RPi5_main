name: Public repository automation baseline

on:
  workflow_call:
    inputs:
      forbid_self_hosted:
        description: Reject persistent self-hosted GitHub Actions runners in caller workflows
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  policy:
    name: public automation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce public repository automation baseline
        env:
          FORBID_SELF_HOSTED: ${{ inputs.forbid_self_hosted && 'true' || 'false' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import re
          import sys

          root = Path('.github/workflows')
          workflows = sorted([*root.glob('*.yml'), *root.glob('*.yaml')])
          if not workflows:
              raise SystemExit('automation baseline: no workflow files found')

          full_sha = re.compile(r'^[0-9a-f]{40}$')
          uses_line = re.compile(r'^\s*-?\s*uses:\s*([^\s#]+)')
          runs_on = re.compile(r'^(\s*)runs-on:\s*(.*)$')
          list_item = re.compile(r'^(\s*)-\s*([^#\s]+)')
          forbid_self_hosted = os.environ.get('FORBID_SELF_HOSTED') == 'true'

          errors: list[str] = []

          for path in workflows:
              lines = path.read_text(encoding='utf-8').splitlines()

              if any(re.match(r'^\s*permissions:\s*write-all\s*$', line) for line in lines):
                  errors.append(f'{path}: permissions: write-all is forbidden')

              for number, line in enumerate(lines, start=1):
                  match = uses_line.match(line)
                  if match:
                      target = match.group(1)
                      if target.startswith('./') or target.startswith('docker://'):
                          continue
                      if '@' not in target:
                          errors.append(f'{path}:{number}: external uses target has no immutable revision')
                          continue
                      _, revision = target.rsplit('@', 1)
                      if not full_sha.fullmatch(revision):
                          errors.append(
                              f'{path}:{number}: external action/reusable workflow is not pinned to a full 40-character commit SHA'
                          )

              if not forbid_self_hosted:
                  continue

              index = 0
              while index < len(lines):
                  match = runs_on.match(lines[index])
                  if not match:
                      index += 1
                      continue
                  base_indent = len(match.group(1))
                  value = match.group(2).strip()
                  if 'self-hosted' in value:
                      errors.append(f'{path}:{index + 1}: self-hosted runner is forbidden by public baseline')
                      index += 1
                      continue
                  if value:
                      index += 1
                      continue

                  cursor = index + 1
                  while cursor < len(lines):
                      raw = lines[cursor]
                      if not raw.strip() or raw.lstrip().startswith('#'):
                          cursor += 1
                          continue
                      indent = len(raw) - len(raw.lstrip())
                      if indent <= base_indent:
                          break
                      item = list_item.match(raw)
                      if item and item.group(2) == 'self-hosted':
                          errors.append(
                              f'{path}:{cursor + 1}: self-hosted runner is forbidden by public baseline'
                          )
                      cursor += 1
                  index = cursor

          if errors:
              print('Public repository automation baseline: FAIL', file=sys.stderr)
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          print('Public repository automation baseline: PASS')
          print(f'WORKFLOWS_SCANNED={len(workflows)}')
          print('EXTERNAL_USES_REQUIRE_FULL_SHA=true')
          print(f'SELF_HOSTED_FORBIDDEN={str(forbid_self_hosted).lower()}')
          PY
