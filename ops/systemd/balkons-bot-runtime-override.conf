# SOURCE-ONLY DEPLOYMENT OVERLAY — RPi5_main#192.
# Install only inside an exact owner-authorized Composite STRICT transaction.
[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/rpi5-balkons-bot.py
ExecStartPost=
ExecReload=
ExecStop=
ExecStopPost=
LoadCredential=
LoadCredentialEncrypted=
LoadCredentialEncrypted=telegram-token:/etc/credstore.encrypted/balkons-bot-telegram-token
LoadCredentialEncrypted=telegram-chat-id:/etc/credstore.encrypted/balkons-bot-telegram-chat-id
LoadCredentialEncrypted=mqtt-host:/etc/credstore.encrypted/balkons-bot-mqtt-host
LoadCredentialEncrypted=mqtt-username:/etc/credstore.encrypted/balkons-bot-mqtt-username
LoadCredentialEncrypted=mqtt-secret:/etc/credstore.encrypted/balkons-bot-mqtt-secret
Environment=
EnvironmentFile=
PassEnvironment=
Environment=PYTHONDONTWRITEBYTECODE=1
UnsetEnvironment=BOT_TOKEN CHAT_ID MQTT_USER MQTT_USERNAME MQTT_PASS MQTT_PASSWORD MQTT_SECRET TELEGRAM_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TG_TOKEN TG_CHAT_ID
SendSIGKILL=no
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=read-only
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=
AmbientCapabilities=
StandardOutput=journal
StandardError=journal
