# SOURCE ONLY: scripts.yaml mapping, not installed or scheduled.
# This script only reads a forecast and returns a hypothetical decision.
balkons_watering_dry_run:
  alias: Balkons - watering dry run
  mode: single
  sequence:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_response
      continue_on_error: true
    - variables:
        result: >-
          {% set clock = now() %}
          {% set today = clock.date() %}
          {% set end_day = as_local(as_datetime(as_timestamp(clock) + 86400)).date() %}
          {% set days = range((end_day - today).days + 1) | list %}
          {% set required_days = namespace(values=[]) %}
          {% for offset in days %}
            {% set required_days.values = required_days.values + [(today + timedelta(days=offset)).isoformat()] %}
          {% endfor %}
          {% set sensors = namespace(dry=0, moist=0, degraded=[], invalid=[]) %}
          {% for i in [1,3,4,5,6,7,8,9,10,12] %}
            {% set value = states('sensor.balkona_laistisana_puke_' ~ i) %}
            {% if value == 'sauss' %}
              {% set sensors.dry = sensors.dry + 1 %}
            {% elif value == 'mitrs' %}
              {% set sensors.moist = sensors.moist + 1 %}
            {% elif value in ['', 'unknown', 'unavailable'] %}
              {% set sensors.degraded = sensors.degraded + [i] %}
            {% else %}
              {% set sensors.invalid = sensors.invalid + [i] %}
            {% endif %}
          {% endfor %}
          {% set weather = 'weather.forecast_home' %}
          {% set current = state_attr(weather, 'temperature') %}
          {% set forecast = namespace(lows=[], seen=[], invalid=false) %}
          {% set response = forecast_response | default(none) %}
          {% set entry = response.get(weather) if response is mapping else none %}
          {% set rows = entry.get('forecast') if entry is mapping else none %}
          {% if rows is sequence and rows is not string and rows is not mapping %}
            {% for row in rows %}
              {% set stamp = as_datetime(row.get('datetime'), none) if row is mapping and row.get('datetime') is string else none %}
              {% if stamp is none or stamp.tzinfo is none %}
                {% set forecast.invalid = true %}
              {% else %}
                {% set day = as_local(stamp).date().isoformat() %}
                {% if day in required_days.values %}
                  {% set low = row.get('templow') %}
                  {% if day in forecast.seen or low is boolean or not is_number(low) %}
                    {% set forecast.invalid = true %}
                  {% else %}
                    {% set forecast.seen = forecast.seen + [day] %}
                    {% set forecast.lows = forecast.lows + [low | float] %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% else %}
            {% set forecast.invalid = true %}
          {% endif %}
          {% set temp_ok = has_value(weather) and state_attr(weather, 'temperature_unit') == '°C'
             and current is not boolean and is_number(current) and not forecast.invalid
             and (forecast.seen | sort) == (required_days.values | sort) %}
          {% set low = ([current | float] + forecast.lows) | min if temp_ok else none %}
          {% set marker = 'input_datetime.balkons_last_watering_attempt' %}
          {% set marker_value = states(marker) %}
          {% set marker_date = strptime(marker_value, '%Y-%m-%d', none) %}
          {% set day_ok = marker_date is not none and marker_date.date().isoformat() == marker_value
             and state_attr(marker, 'has_date') == true and state_attr(marker, 'has_time') == false %}
          {% set reason = 'would_water' %}
          {% if clock.tzinfo | string != 'Europe/Berlin' %}
            {% set reason = 'block_timezone' %}
          {% elif states('switch.balkona_laistisana_suknis') != 'off' %}
            {% set reason = 'block_pump_state' %}
          {% elif not day_ok or marker_date.date() > today %}
            {% set reason = 'block_day_state' %}
          {% elif marker_date.date() == today %}
            {% set reason = 'block_already_attempted' %}
          {% elif sensors.invalid | length > 0 %}
            {% set reason = 'block_sensor_value' %}
          {% elif sensors.degraded | length > 2 %}
            {% set reason = 'block_sensor_coverage' %}
          {% elif not temp_ok %}
            {% set reason = 'block_forecast' %}
          {% elif low <= 2 %}
            {% set reason = 'block_frost' %}
          {% elif sensors.dry < 2 %}
            {% set reason = 'skip_dry_quorum' %}
          {% elif sensors.moist + (sensors.degraded | length) >= 8 %}
            {% set reason = 'skip_moist' %}
          {% endif %}
          {{ dict(decision=reason, dry_run=true, live_authorized=false,
             candidate_seconds=45, dry=sensors.dry, measured_moist=sensors.moist,
             assumed_moist=sensors.degraded, invalid_sensors=sensors.invalid,
             minimum_c=low) }}
    - stop: Dry-run decision only
      response_variable: result
