name: WeatherNext private installer boundary bootstrap reconcile source

on:
  pull_request:
    paths:
      - "ops/bin/rpi5-weathernext-private-installer-boundary-bootstrap"
      - "ops/contracts/weathernext-private-installer-boundary-bootstrap-v1.json"
      - "ops/lib/deploy_executor/weather_private_installer_boundary_bootstrap_reconcile.py"
      - "ops/lib/deploy_executor/weather_private_installer_boundary_bootstrap_reconcile_runtime.py"
      - "ops/lib/deploy_executor/weather_private_privileged_dispatch.py"
      - "tests/test-weather-private-installer-boundary-bootstrap.py"
      - "tests/test-weather-private-installer-boundary-manager-runtime-mode.py"
      - "tests/test-weather-private-installer-boundary-bootstrap-reconcile.py"
      - "tests/test-weather-private-installer-boundary-bootstrap-reconcile-runtime.py"
      - ".github/workflows/weathernext-private-installer-boundary-bootstrap-reconcile-source.yml"
  push:
    branches:
      - main
    paths:
      - "ops/bin/rpi5-weathernext-private-installer-boundary-bootstrap"
      - "ops/contracts/weathernext-private-installer-boundary-bootstrap-v1.json"
      - "ops/lib/deploy_executor/weather_private_installer_boundary_bootstrap_reconcile.py"
      - "ops/lib/deploy_executor/weather_private_installer_boundary_bootstrap_reconcile_runtime.py"
      - "ops/lib/deploy_executor/weather_private_privileged_dispatch.py"
      - "tests/test-weather-private-installer-boundary-bootstrap.py"
      - "tests/test-weather-private-installer-boundary-manager-runtime-mode.py"
      - "tests/test-weather-private-installer-boundary-bootstrap-reconcile.py"
      - "tests/test-weather-private-installer-boundary-bootstrap-reconcile-runtime.py"
      - ".github/workflows/weathernext-private-installer-boundary-bootstrap-reconcile-source.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate WeatherNext bootstrap reconcile source
        run: |
          python3 ./tests/test-weather-private-installer-boundary-bootstrap.py
          python3 ./tests/test-weather-private-installer-boundary-manager-runtime-mode.py
          python3 ./tests/test-weather-private-installer-boundary-bootstrap-reconcile.py
          python3 ./tests/test-weather-private-installer-boundary-bootstrap-reconcile-runtime.py
          python3 -m py_compile \
            ./ops/lib/deploy_executor/weather_private_installer_boundary_bootstrap_reconcile.py \
            ./ops/lib/deploy_executor/weather_private_installer_boundary_bootstrap_reconcile_runtime.py \
            ./ops/lib/deploy_executor/weather_private_privileged_dispatch.py
