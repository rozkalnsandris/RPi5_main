# Hermes Tech static-origin policy. Mounted read-only as /etc/nginx/conf.d/default.conf.
# Cache policy is selected once at http scope so security headers are not lost
# through location-level add_header inheritance differences on older Nginx.
map $uri $hermes_cache_control {
    default "no-cache";
    ~^/css/site\.min\.[0-9a-f]+\.css$ "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control $hermes_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; manifest-src 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
