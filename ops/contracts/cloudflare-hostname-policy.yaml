schema_version: 1
status: desired-state
canonical_issue: 177
last_reviewed: 2026-08-17

# Public-safe desired-state registry.
# Never place account IDs, tunnel IDs, Access AUD tags, owner emails,
# source public IPs, tokens, credentials, or recovery secrets in this file.
# audit_route_presence is the expected current route state for read-only
# reconciliation; it never authorizes creating/removing a route.

invariants:
  shared_tunnel_owner: RPi5_main
  inbound_router_port_forward: false
  admin_persistent_bypass_allowed: false
  human_service_token_access_allowed: false
  owner_phone_identity_model: cloudflare_one_client
  owner_phone_initial_posture: require_warp
  owner_phone_mac_binding: false
  production_mutation_requires_explicit_owner_authorization: true

trust_classes:
  PUBLIC:
    access_required: false
    persistent_bypass_allowed: false
    preferred_origin_scope: loopback
  FAMILY_PRIVATE:
    access_required: true
    persistent_bypass_allowed: false
    preferred_origin_scope: loopback
  ADMIN:
    access_required: true
    persistent_bypass_allowed: false
    preferred_owner_scope: exact-owner
    owner_phone_posture_required: true
    preferred_origin_scope: loopback-or-explicit-break-glass

hostnames:
  - hostname: rozkalns.net
    owner_repo: rozkalnsandris/rozkalns-cv
    delivery: shared_rpi5_tunnel
    trust_class: PUBLIC
    desired_origin_scope: loopback
    access_application_scope: none
    protect_with_access: false
    app_jwt_validation: false
    lan_break_glass: false
    audit_route_presence: present
    evidence: implementation-loopback-doc-drift

  - hostname: tech.rozkalns.net
    owner_repo: rozkalnsandris/hermes-tech
