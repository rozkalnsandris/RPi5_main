name: Ausmalwiese admin publish source
on:
  pull_request:
    paths:
      - "ops/bin/coloring-pages-admin-publish"
      - "ops/admin/coloring-pages/**"
      - "ops/contracts/coloring-pages-admin-publish-v1.json"
      - "ops/systemd/coloring-pages-admin-publish.service"
      - "scripts/install-coloring-pages-admin-publish-v1.sh"
      - "tests/test-coloring-pages-admin-publish-v1.py"
      - "tests/test-coloring-pages-admin-categories-1291.py"
      - "docs/COLORING_PAGES_ADMIN_PUBLISH_V1.md"
      - ".github/workflows/ausmalwiese-admin-publish-source.yml"
  push:
    branches: [main]
    paths:
      - "ops/bin/coloring-pages-admin-publish"
      - "ops/admin/coloring-pages/**"
      - "ops/contracts/coloring-pages-admin-publish-v1.json"
      - "ops/systemd/coloring-pages-admin-publish.service"
      - "scripts/install-coloring-pages-admin-publish-v1.sh"
      - "tests/test-coloring-pages-admin-publish-v1.py"
      - "tests/test-coloring-pages-admin-categories-1291.py"
      - "docs/COLORING_PAGES_ADMIN_PUBLISH_V1.md"
      - ".github/workflows/ausmalwiese-admin-publish-source.yml"
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate source
        run: |
          python3 tests/test-coloring-pages-admin-publish-v1.py
          python3 tests/test-coloring-pages-admin-categories-1291.py
          python3 -m py_compile ops/bin/coloring-pages-admin-publish
          python3 -m json.tool ops/contracts/coloring-pages-admin-publish-v1.json >/dev/null
          bash -n scripts/install-coloring-pages-admin-publish-v1.sh
