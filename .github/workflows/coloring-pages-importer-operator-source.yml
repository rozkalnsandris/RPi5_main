name: Coloring Pages importer operator source

on:
  pull_request:
    paths:
      - "ops/bin/coloring-pages-import"
      - "ops/contracts/coloring-pages-importer-operator-v1.json"
      - "ops/contracts/simple-deploy-host-v1.json"
      - "scripts/install-coloring-pages-importer-operator-v1.sh"
      - "tests/test-coloring-pages-importer-operator-v1.py"
      - "docs/COLORING_PAGES_IMPORTER_OPERATOR_V1.md"
      - "docs/SIMPLE_DEPLOY_COLORING_PAGES_TARGET_V1.md"
      - ".github/workflows/coloring-pages-importer-operator-source.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate importer operator source
        run: python3 ./tests/test-coloring-pages-importer-operator-v1.py

      - name: Validate existing Coloring Pages target
        run: python3 ./tests/test-simple-deploy-coloring-pages-target-v1.py
