name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpi5-main-validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository
        env:
          PUBLIC_SAFETY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make validate

      - name: Validate runner-smoke absent systemd unit observation
        run: python3 ./tests/test-hermes-deals-runner-smoke-systemctl-state.py

      - name: Validate V12 WeatherNext bootstrap boundary
        run: python3 ./tests/test-v12-weathernext-bootstrap.py

      - name: Validate Weather v7 host capability installer
        run: python3 ./tests/test-weather-operator-v7-host-capability-installer.py

      - name: Validate Weather v7 sudo Git trust boundary
        run: python3 ./tests/test-weather-v7-host-capability-sudo-git-trust.py

      - name: Validate Weather v7 installer source delivery
        run: python3 ./tests/test-weather-v7-host-capability-installer-source-delivery.py

      - name: Validate Weather v7 identity-only dispatch caller
        run: python3 ./tests/test-weather-operator-v7-dispatch-caller.py

      - name: Validate Weather v7 broker registration Git trust repair
        run: python3 ./tests/test-weather-v7-host-capability-registration-repair.py

      - name: Validate Weather v7 home-access and authorization provenance repair
        run: python3 ./tests/test-weather-v7-host-capability-home-access-repair.py

      - name: Validate Weather v9 privileged delivery successor
        run: python3 ./tests/test-weather-operator-v9-privileged-delivery.py

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pinned Gitleaks history scan
        run: bash ./scripts/run-gitleaks-ci.sh

  public-automation-baseline:
    uses: rozkalnsandris/ops-workflows/.github/workflows/public-repo-baseline.yml@e2fa7ecb1b1cdfab0711d8e3e147b5ae03a9a3f2
    with:
      forbid_self_hosted: true
