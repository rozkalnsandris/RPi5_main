name: WeatherNext private GCS simple canary source

on:
  pull_request:
    paths:
      - ".github/workflows/weathernext-private-gcs-prerequisite-rollout-source.yml"
      - "ops/lib/deploy_executor/weather_private_privileged_dispatch.py"
      - "ops/deploy/weather-private-gcs-prerequisite-rollout.json"
      - "tests/test_weather_private_gcs_prerequisite_rollout.py"
      - "docs/WEATHERNEXT_PRIVATE_GCS_PREREQUISITE_ROLLOUT.md"
      - "docs/ROADMAP.md"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weathernext-private-gcs-prerequisite-rollout-source.yml"
      - "ops/lib/deploy_executor/weather_private_privileged_dispatch.py"
      - "ops/deploy/weather-private-gcs-prerequisite-rollout.json"
      - "tests/test_weather_private_gcs_prerequisite_rollout.py"
      - "docs/WEATHERNEXT_PRIVATE_GCS_PREREQUISITE_ROLLOUT.md"
      - "docs/ROADMAP.md"
      - "Makefile"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate simple GCS canary boundary
        run: |
          python3 ./tests/test_weather_private_gcs_prerequisite_rollout.py
          python3 -m py_compile ops/lib/deploy_executor/weather_private_privileged_dispatch.py
