name: WeatherNext private execution bridge source

on:
  pull_request:
    paths:
      - "ops/deploy/weather-private-bigquery-execution-bridge.json"
      - "ops/lib/deploy_executor/weather_private_bigquery_execution_bridge.py"
      - "tests/test-deploy-executor-weather-private-bigquery-execution-bridge.py"
      - "docs/WEATHERNEXT_PRIVATE_BIGQUERY_EXECUTION_BRIDGE.md"
      - ".github/workflows/weathernext-private-execution-bridge-source.yml"
  push:
    branches:
      - main
    paths:
      - "ops/deploy/weather-private-bigquery-execution-bridge.json"
      - "ops/lib/deploy_executor/weather_private_bigquery_execution_bridge.py"
      - "tests/test-deploy-executor-weather-private-bigquery-execution-bridge.py"
      - "docs/WEATHERNEXT_PRIVATE_BIGQUERY_EXECUTION_BRIDGE.md"
      - ".github/workflows/weathernext-private-execution-bridge-source.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate private WeatherNext execution bridge
        run: |
          python3 ./tests/test-deploy-executor-weather-private-bigquery.py
          python3 ./tests/test-deploy-executor-weather-private-bigquery-runtime.py
          python3 ./tests/test-deploy-executor-weather-private-bigquery-execution-bridge.py
          python3 -m py_compile \
            ops/lib/deploy_executor/weather_private_bigquery_contract.py \
            ops/lib/deploy_executor/weather_private_bigquery_runtime_materialization.py \
            ops/lib/deploy_executor/weather_private_bigquery_execution_bridge.py
