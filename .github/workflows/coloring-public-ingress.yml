name: RPi5 #841 Coloring public ingress

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: rpi5-841-coloring-public-ingress
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event.issue.pull_request == null && github.event.issue.number == 841 && startsWith(github.event.comment.body, '/rpi5-841 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.auth.outputs.operation }}
      expected_sha: ${{ steps.auth.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: auth
        run: python3 scripts/github_rpi5_841_bridge.py

  ingress:
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.authorize.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run guarded Coloring Pages ingress operator
        env:
          OPERATION: ${{ needs.authorize.outputs.operation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_P1D03_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_P1D03_ACCOUNT_ID }}
          CLOUDFLARE_P1D03_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D03_READ_API_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          LOG="$RUNNER_TEMP/coloring-841-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          trap 'rm -f -- "$LOG"' EXIT
          set +e
          python3 scripts/cloudflare_coloring_ingress.py "$OPERATION" >"$LOG" 2>&1
          rc=$?
          set -e
          if grep -Ev '^[A-Z0-9_]+=[A-Za-z0-9_.:-]+$' "$LOG" | grep -q .; then
            echo 'operator emitted non-allowlisted evidence' >&2
            exit 1
          fi
          cat "$LOG"
          exit "$rc"
