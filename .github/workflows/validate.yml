name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpi5-main-validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regressions:
    name: regression / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group:
          - syntax-policy
          - weather
          - ausmalwiese-coloring
          - hermes-cv
          - deploy-control
          - cloudflare-ingress
          - balcony
          - host-a
          - host-b
          - misc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate regression group
        run: python3 ./scripts/run-validation-group.py "${{ matrix.group }}"

  api-contract:
    name: GitHub API access contract
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub API access rollout contract
        run: python3 ./tests/test-github-api-access-rollout.py

  targeted-legacy:
    name: targeted legacy regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate targeted legacy regressions
        env:
          VALIDATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ./scripts/targeted_legacy_regressions.py

  secret-scan:
    name: tracked source secret guard
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tracked source for secret-like material
        run: ./scripts/check-no-secrets.sh

  public-safety:
    name: public diff safety
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate public diff safety
        env:
          PUBLIC_SAFETY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash ./scripts/check-public-safety.sh

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pinned Gitleaks history scan
        run: bash ./scripts/run-gitleaks-ci.sh

  public-automation-baseline:
    uses: rozkalnsandris/ops-workflows/.github/workflows/public-repo-baseline.yml@e2fa7ecb1b1cdfab0711d8e3e147b5ae03a9a3f2
    with:
      forbid_self_hosted: true

  workflow-security:
    name: GitHub Actions static analysis
    uses: rozkalnsandris/ops-workflows/.github/workflows/workflow-security.yml@0450e662093c41e98ca96802b523ac91eb02e5fe
    permissions:
      contents: read

  validate:
    if: ${{ always() }}
    needs:
      - regressions
      - api-contract
      - targeted-legacy
      - secret-scan
      - public-safety
      - gitleaks
      - public-automation-baseline
      - workflow-security
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every validation dependency to pass
        env:
          REGRESSIONS_RESULT: ${{ needs.regressions.result }}
          API_CONTRACT_RESULT: ${{ needs['api-contract'].result }}
          TARGETED_LEGACY_RESULT: ${{ needs['targeted-legacy'].result }}
          SECRET_SCAN_RESULT: ${{ needs['secret-scan'].result }}
          PUBLIC_SAFETY_RESULT: ${{ needs['public-safety'].result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          PUBLIC_AUTOMATION_RESULT: ${{ needs['public-automation-baseline'].result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs['workflow-security'].result }}
        run: python3 ./scripts/require-validation-results.py
