name: Work-cycle v2.3 conformance

on:
  pull_request:
    paths:
      - '.github/agent-bootstrap.json'
      - '.github/work-cycle-v23.json'
      - '.github/github-api-access-v1.json'
      - '.github/auto-run-full-v2.json'
      - '.github/auto-run-lane-policy-v1.json'
      - 'docs/WORK_CYCLE_V23_ADOPTION.md'
      - '.github/workflows/work-cycle-v23-conformance.yml'
  push:
    branches: [main]
    paths:
      - '.github/agent-bootstrap.json'
      - '.github/work-cycle-v23.json'
      - '.github/github-api-access-v1.json'
      - '.github/auto-run-full-v2.json'
      - '.github/auto-run-lane-policy-v1.json'
      - 'docs/WORK_CYCLE_V23_ADOPTION.md'
      - '.github/workflows/work-cycle-v23-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RPi5_main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout accepted shared work-cycle contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rozkalnsandris/ops-workflows
          ref: 274d58f2d9d3cb86feded2751b8f9009a4501f6b
          path: .work-cycle-shared
          persist-credentials: false

      - name: Validate bootstrap manifest with canonical validator
        run: >-
          python3 .work-cycle-shared/scripts/agent_bootstrap_manifest.py
          .github/agent-bootstrap.json
          --repo-root .

      - name: Validate RPi5_main adapter and local stricter-rule preservation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          adapter = json.loads(Path('.github/work-cycle-v23.json').read_text())
          full = json.loads(Path('.github/auto-run-full-v2.json').read_text())
          api = json.loads(Path('.github/github-api-access-v1.json').read_text())
          agents = Path('AGENTS.md').read_text()

          assert adapter['schema'] == 'rozkalns.work-cycle-v23.consumer.v1'
          assert adapter['canonical_revision'] == '274d58f2d9d3cb86feded2751b8f9009a4501f6b'
          assert adapter['bootstrap_manifest']['mutable_operational_truth_allowed'] is False
          assert adapter['start_contract']['safe_auto_continuation'] is True
          assert adapter['start_contract']['compact_terminal_response'] is True
          assert adapter['start_contract']['local_owner_gates_preserved'] is True

          preflight = adapter['write_preflight']
          assert preflight['status'] == 'ADOPTED'
          assert preflight['contract'] == 'WRITE_PREFLIGHT_COMPACT_V1'
          assert preflight['exact_existing_intent'] == 'RECONCILE_OR_NOOP'
          assert preflight['conflicting_identity'] == 'STOP'
          assert preflight['stale_writer'] == 'STOP'
          assert preflight['duplicate_framework_created'] is False

          normalized = adapter['auto_run_full_normalized_state']
          assert normalized['status'] == 'BLOCKED_LOCAL_MULTI_LANE'
          assert normalized['current_max_concurrent_runnable_source_lanes'] == 4
          assert normalized['historical_or_active_state_rewritten'] is False
          assert normalized['second_controller_framework_created'] is False

          assert full['execution_model']['one_active_issue_at_a_time'] is False
          assert full['execution_model']['max_concurrent_runnable_source_lanes'] == 4
          assert full['execution_model']['controller_issue_role'] == 'AGGREGATE_RECONCILIATION_VIEW'
          assert full['lane_concurrency']['live_exclusive_is_global'] is True

          local = adapter['local_stricter_rules']
          assert local['fast_merge_requires_explicit_owner_decision'] is True
          assert local['runtime_live_requires_exact_owner_authority'] is True
          assert local['protected_runtime_inspection_requires_exact_owner_authority'] is True
          assert local['rdc_never_widens_authority'] is True
          assert local['merge_implies_live'] is False

          assert api['mutation_boundary']['expected_head_binding_required_when_supported'] is True
          assert api['mutation_boundary']['post_dispatch_uncertainty_fail_closed'] is True
          assert 'Merge remains explicit owner authority in FAST' in agents
          assert 'RDC is execution/transport only, never source or authorization authority' in agents

          authority = adapter['authority']
          assert not any(authority.values())
          print('WORK_CYCLE_V23_RPI5_CONFORMANCE=PASS')
          PY
