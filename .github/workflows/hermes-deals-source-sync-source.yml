name: Hermes Deals source-sync source

on:
  pull_request:
    paths:
      - ops/contracts/hermes-deals-source-sync-v1.json
      - ops/contracts/hermes-deals-source-sync-evidence-v1.json
      - ops/lib/deploy_executor/hermes_deals_source_sync_evidence.py
      - tests/test-hermes-deals-source-sync-evidence.py
      - ops/deploy/executor-operations.json
      - tests/test-hermes-deals-source-sync.py
      - tests/test-deploy-executor-p4.py
      - tests/test-hermes-deals-runner-smoke-install.py
      - docs/HERMES_DEALS_SOURCE_SYNC.md
      - .github/workflows/hermes-deals-source-sync-source.yml
  push:
    branches:
      - main
    paths:
      - ops/contracts/hermes-deals-source-sync-v1.json
      - ops/contracts/hermes-deals-source-sync-evidence-v1.json
      - ops/lib/deploy_executor/hermes_deals_source_sync_evidence.py
      - tests/test-hermes-deals-source-sync-evidence.py
      - ops/deploy/executor-operations.json
      - tests/test-hermes-deals-source-sync.py
      - tests/test-deploy-executor-p4.py
      - tests/test-hermes-deals-runner-smoke-install.py
      - docs/HERMES_DEALS_SOURCE_SYNC.md
      - .github/workflows/hermes-deals-source-sync-source.yml

permissions:
  contents: read

jobs:
  source-sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate source-sync static boundary
        run: |
          python3 ./tests/test-hermes-deals-source-sync.py
          python3 ./tests/test-hermes-deals-source-sync-evidence.py
          python3 ./tests/test-deploy-executor-p4.py
          python3 ./tests/test-hermes-deals-runner-smoke-install.py
