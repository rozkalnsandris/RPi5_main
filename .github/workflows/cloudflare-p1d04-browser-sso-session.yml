name: Cloudflare P1D-04 browser SSO session

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-p1d04-browser-sso-session
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact owner P1D-04 command
    if: github.event.issue.pull_request == null && github.event.issue.number == 179 && startsWith(github.event.comment.body, '/rpi5-p1d04 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      expected_sha: ${{ steps.authorize.outputs.expected_sha }}
      canary: ${{ steps.authorize.outputs.canary }}
      issue_number: ${{ steps.authorize.outputs.issue_number }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
      trigger_actor: ${{ steps.authorize.outputs.trigger_actor }}

    steps:
      - name: Checkout default-branch authorizer
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact issue, owner, canary and SHA-bound command
        id: authorize
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/github_p1d04_browser_sso_bridge.py

  apply:
    name: Apply one guarded Organization session update
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact authorized main source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.authorize.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run exact P1D-04 canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P1D04_EXPECTED_SHA: ${{ needs.authorize.outputs.expected_sha }}
          P1D04_CANARY: ${{ needs.authorize.outputs.canary }}
          CLOUDFLARE_P1D04_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_P1D04_ACCOUNT_ID }}
          CLOUDFLARE_P1D04_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D04_READ_API_TOKEN }}
          CLOUDFLARE_P1D04_WRITE_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D04_WRITE_API_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 scripts/cloudflare_owner_browser_sso_session_update_actions.py
