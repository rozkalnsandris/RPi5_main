name: rozkalns-cv SIMPLE-DEPLOY source contract

on:
  pull_request:
    paths:
      - "ops/contracts/simple-deploy-rozkalns-cv-compat-v1.json"
      - "ops/contracts/simple-deploy-host-v1.json"
      - "ops/deploy/simple-deploy-targets-v1.json"
      - "ops/deploy/baselines/simple-deploy-targets-weather-cv-v1.json"
      - "ops/deploy/rozkalns-cv-simple-deploy-cutover-v1.json"
      - "ops/deploy/rozkalns-cv-post-cutover-reconciliation-v1.json"
      - "ops/bin/rozkalns-cv-post-cutover-reconcile"
      - "ops/deploy/executor-operations.json"
      - "ops/deploy/simple-deploy-compose/rozkalns-cv.yml"
      - "docs/SIMPLE_DEPLOY_ROZKALNS_CV_COMPAT_V1.md"
      - "tests/test-simple-deploy-rozkalns-cv-compat-v1.py"
      - "tests/test-simple-deploy-v1.py"
      - "tests/test_rozkalns_cv_private_env_materializer.py"
      - "tests/test_rozkalns_cv_simple_deploy_cutover_contract.py"
      - "tests/test_rozkalns_cv_post_cutover_reconciliation.py"
      - "scripts/materialize-simple-deploy-rozkalns-cv-private-env-v1.py"
      - "tests/test-deploy-executor-p4.py"
      - "Makefile"
      - "tests/test-simple-deploy-hermes-tech-target-v1.py"
      - ".github/workflows/simple-deploy-rozkalns-cv-compat-source.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate rozkalns-cv target contract
        run: |
          python3 ./tests/test-simple-deploy-rozkalns-cv-compat-v1.py
          python3 ./tests/test-simple-deploy-v1.py
          python3 ./tests/test_rozkalns_cv_private_env_materializer.py
          python3 ./tests/test_rozkalns_cv_simple_deploy_cutover_contract.py
          python3 ./tests/test_rozkalns_cv_post_cutover_reconciliation.py
          python3 ./tests/test-deploy-executor-p4.py
          python3 ./tests/test-simple-deploy-hermes-tech-target-v1.py