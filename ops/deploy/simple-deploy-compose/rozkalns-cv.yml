# SIMPLE-DEPLOY v1 RPi5-owned rozkalns-cv adapter.
# The :production tag is discovery/default metadata only; the generic deployer
# must freeze and apply an exact image@sha256 digest override before mutation.
# The first adoption materializes the private app env behind the deployer-owned
# /etc boundary while durable data remains reused in place through a host-only
# Compose interpolation value.
name: rozkalns-cv

services:
  cv:
    image: ghcr.io/rozkalnsandris/rozkalns-cv:production
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    env_file:
      - ../private/rozkalns-cv.env
    environment:
      ASSISTANT_DB_PATH: /app/data/assistant.sqlite3
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      LLM_BASE_URL: https://api.openai.com
      LLM_MODEL: gpt-5.6-luna
    volumes:
      - type: bind
        source: ${ROZKALNS_CV_DATA_PATH:?ROZKALNS_CV_DATA_PATH must be set}
        target: /app/data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
