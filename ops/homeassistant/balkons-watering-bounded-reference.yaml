# SOURCE REFERENCE ONLY. Do not install or enable; no release authority.
# Both script entry points and the scheduler are hard-inhibited independently.
# Existing HA entities/scripts/Telegram automations must not be replaced.
input_boolean:
  balkons_watering_arm_reference:
    name: Balkons watering arm reference
    initial: false
  balkons_watering_pending_reference:
    name: Balkons watering incomplete attempt reference
    initial: true

mqtt:
  sensor:
    - name: Balkons HA45 reply reference
      unique_id: balkons_ha45_reply_reference
      state_topic: balkons/ha45/reply
      qos: 0
      expire_after: 60
      force_update: true

script:
  balkons_watering_bounded_reference:
    alias: Balkons bounded watering reference (INHIBITED)
    mode: single
    sequence:
      - alias: Source release prohibited
        condition: template
        value_template: "{{ false }}"
      - condition: state
        entity_id: input_boolean.balkons_watering_arm_reference
        state: "on"
      - condition: state
        entity_id: input_boolean.balkons_watering_pending_reference
        state: "off"
      - variables:
          marker: input_datetime.balkons_last_watering_attempt
          pump: switch.balkona_laistisana_suknis
          arm: input_boolean.balkons_watering_arm_reference
          pending: input_boolean.balkons_watering_pending_reference
          mailbox: sensor.balkons_ha45_reply_reference
          day: "{{ now().date().isoformat() }}"
          old_date: "{{ states(marker) }}"
          expected_revision: '65309e8902c31f561e4a20bbc2c415544cfd6933'
          on_seen: false
          off_seen: false
      - variables:
          arm_generation: >-
            {{ 'arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()
               if is_state(arm, 'on') else '' }}
          snapshot: >-
            {{ [states('weather.forecast_home'),
                 state_attr('weather.forecast_home', 'temperature'),
                 state_attr('weather.forecast_home', 'temperature_unit')] }}
      - action: script.balkons_watering_dry_run
        response_variable: preview
      - condition: template
        value_template: >-
          {{ preview is mapping and preview.get('dry_run') is sameas true
             and preview.get('live_authorized') is sameas false
             and preview.get('decision') in
                 ['would_water', 'block_sensor_value', 'block_sensor_coverage',
                  'skip_dry_quorum', 'skip_moist']
             and preview.get('candidate_seconds') == 45
             and preview.get('minimum_c') is number
             and preview.get('minimum_c') is not boolean
             and is_number(preview.get('minimum_c'))
             and preview.get('minimum_c') > 2 }}
      - alias: Runtime session and transport proof not established
        condition: template
        value_template: "{{ false }}"
      - condition: template
        value_template: >-
          {{ now().tzinfo | string == 'Europe/Berlin'
             and now().date().isoformat() == day and states(marker) == old_date
             and old_date < day and state_attr(marker, 'has_date') is sameas true
             and state_attr(marker, 'has_time') is sameas false
             and is_state(pump, 'off') and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) and is_state(pending, 'off') }}
      # Latch before any protocol dispatch. Any abort leaves it blocked.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.balkons_watering_pending_reference
      - variables:
          pending_generation: >-
            {{ 'pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()
               if is_state(pending, 'on') else '' }}
      - condition: template
        value_template: >-
          {{ (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
             and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation)
             and is_state(pump, 'off') }}
      - variables:
          # Correlation only, not authentication. Runtime uniqueness still requires proof.
          # Prefix preserves opaque hex even when it looks like a number.
          request_payload: >-
            {{ 'ticket45:%04x%04x%04x%04x' | format(range(65536)|random, range(65536)|random,
                                                   range(65536)|random, range(65536)|random) }}
          request_at: "{{ as_timestamp(now()) }}"
      - condition: template
        value_template: >-
          {{ request_payload | length == 25
             and request_payload | regex_match('^ticket45:[0-9a-f]{16}$')
             and not states(mailbox).startswith('offer2:' ~ request_payload[9:] ~ ':')
             and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) and (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation) and is_state(pump, 'off') }}
      - action: mqtt.publish
        data:
          topic: balkons/sukna/komanda
          payload: "{{ request_payload }}"
          qos: 1
          retain: false
      # The MQTT sensor listener must already be subscribed before ticket dispatch.
      - wait_template: >-
          {%- set reply = states(mailbox) -%}
          {{ not (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) or not (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
             or reply.startswith('offer2:' ~ request_payload[9:] ~ ':') }}
        timeout: "00:00:05"
        continue_on_timeout: false
      - variables:
          offer_record: >-
            {%- set reply = states[mailbox] -%}
            {{ {'payload': reply.state, 'updated': as_timestamp(reply.last_updated)}
               if reply is not none else {'payload': '', 'updated': 0} }}
      - variables:
          offer: "{{ offer_record.payload }}"
          offer_updated: "{{ offer_record.updated }}"
      - condition: template
        value_template: >-
          {{ wait.completed and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) and (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
             and offer | length == 104
             and offer[:24] == 'offer2:' ~ request_payload[9:] ~ ':'
             and offer[24:] | regex_match('^[0-9a-f]{24}:[0-9a-f]{40}:[DWMU]{10}:off$')
             and offer[49:89] == expected_revision
             and request_at < offer_updated <= as_timestamp(now())
             and offer_updated - request_at <= 5
             and 0 <= as_timestamp(now()) - request_at < 8 }}
      - alias: Evaluate only the ten fresh device sample codes
        condition: template
        value_template: >-
          {%- set codes = offer[90:100] -%}
          {{ codes | length == 10 and codes | regex_match('^[DWMU]{10}$')
             and codes.count('M') == 0 and codes.count('U') <= 2
             and codes.count('D') >= 2 and codes.count('W') + codes.count('U') < 8 }}
      - variables:
          start_payload: "{{ 'start45:' ~ offer[24:48] }}"
          on_ack: "{{ 'on:' ~ offer[24:48] }}"
          off_ack: "{{ 'off:' ~ offer[24:48] }}"
      - condition: template
        value_template: >-
          {{ now().tzinfo | string == 'Europe/Berlin' and now().date().isoformat() == day
             and states(marker) == old_date and state_attr(marker, 'has_date') is sameas true
             and state_attr(marker, 'has_time') is sameas false and is_state(pump, 'off')
             and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) and (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation) and (states(mailbox) == offer and as_timestamp(states[mailbox].last_updated) == offer_updated) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.balkons_last_watering_attempt
        data:
          date: "{{ day }}"
      - alias: No start until separate source release proves freshness and cancellation
        condition: template
        value_template: "{{ false }}"
      - variables:
          dispatch_at: "{{ as_timestamp(now()) }}"
      - alias: Recheck snapshot, marker, clock, admission and exact frozen offer
        condition: template
        value_template: >-
          {%- set current = [states('weather.forecast_home'),
                             state_attr('weather.forecast_home', 'temperature'),
                             state_attr('weather.forecast_home', 'temperature_unit')] -%}
          {{ current == snapshot and now().tzinfo | string == 'Europe/Berlin'
             and now().date().isoformat() == day and states(marker) == day
             and state_attr(marker, 'has_date') is sameas true
             and state_attr(marker, 'has_time') is sameas false and is_state(pump, 'off')
             and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) and (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation) and (states(mailbox) == offer and as_timestamp(states[mailbox].last_updated) == offer_updated)
             and 0 <= as_timestamp(now()) - request_at < 8 }}
      - action: mqtt.publish
        continue_on_error: true
        data:
          topic: balkons/sukna/komanda
          payload: "{{ start_payload }}"
          qos: 1
          retain: false
      - wait_template: >-
          {{ not (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) or not (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
             or states(mailbox) == on_ack or states(mailbox) == off_ack }}
        timeout: "00:00:05"
        continue_on_timeout: true
      - variables:
          on_seen: >-
            {{ wait.completed and states(mailbox) == on_ack
               and dispatch_at < as_timestamp(states[mailbox].last_updated) <= as_timestamp(now())
               and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) and (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
               and 0 <= as_timestamp(now()) - dispatch_at <= 5 }}
      - if:
          - condition: template
            value_template: "{{ on_seen }}"
        then:
          - wait_template: >-
              {{ not (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) or not (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
                 or (states(mailbox) == off_ack and is_state(pump, 'off')) }}
            timeout:
              seconds: "{{ [0, [45, 45 - (as_timestamp(now()) - dispatch_at)] | min] | max }}"
            continue_on_timeout: true
          - variables:
              off_seen: >-
                {{ wait.completed and states(mailbox) == off_ack
                   and dispatch_at < as_timestamp(states[mailbox].last_updated) <= as_timestamp(now())
                   and is_state(pump, 'off') and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation)
                   and (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
                   and 0 <= as_timestamp(now()) - dispatch_at <= 45 }}
      - if:
          - condition: template
            value_template: >-
              {{ on_seen and off_seen and (is_state(arm, 'on') and ('arm:' ~ states[arm].context.id ~ ':' ~ states[arm].last_changed.isoformat()) == arm_generation) and (is_state(pending, 'on') and ('pending:' ~ states[pending].context.id ~ ':' ~ states[pending].last_changed.isoformat()) == pending_generation)
                 and is_state(pump, 'off') and states(mailbox) == off_ack
                 and dispatch_at < as_timestamp(states[mailbox].last_updated) <= as_timestamp(now())
                 and now().tzinfo | string == 'Europe/Berlin'
                 and now().date().isoformat() == day and states(marker) == day
                 and state_attr(marker, 'has_date') is sameas true
                 and state_attr(marker, 'has_time') is sameas false }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.balkons_watering_pending_reference
        else:
          # Ambiguity: leave pending ON and disarm. Bounded OFF only; no ON retry.
          - action: input_boolean.turn_off
            continue_on_error: true
            target:
              entity_id: input_boolean.balkons_watering_arm_reference
          - repeat:
              sequence:
                - action: mqtt.publish
                  continue_on_error: true
                  data:
                    topic: balkons/sukna/komanda
                    payload: "OFF"
                    qos: 1
                    retain: false
                - wait_template: >-
                    {{ states(mailbox) == off_ack and is_state(pump, 'off')
                       and dispatch_at < as_timestamp(states[mailbox].last_updated) <= as_timestamp(now()) }}
                  timeout: "00:00:05"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ repeat.index >= 3 or wait.completed }}"
          - stop: Uncertain bounded cycle; recovery required
            error: true

  balkons_watering_stop_reference:
    alias: Balkons independent STOP reference (INHIBITED)
    mode: parallel
    max: 2
    sequence:
      - alias: Source release prohibited
        condition: template
        value_template: "{{ false }}"
      # Disarm and cancel before OFF; latch recovery even if no attempt ran.
      - action: input_boolean.turn_off
        continue_on_error: true
        target:
          entity_id: input_boolean.balkons_watering_arm_reference
      - action: script.turn_off
        continue_on_error: true
        target:
          entity_id: script.balkons_watering_bounded_reference
      - action: input_boolean.turn_on
        continue_on_error: true
        target:
          entity_id: input_boolean.balkons_watering_pending_reference
      - action: mqtt.publish
        data:
          topic: balkons/sukna/komanda
          payload: "OFF"
          qos: 1
          retain: false
      - if:
          - condition: template
            value_template: >-
              {{ not (is_state('input_boolean.balkons_watering_arm_reference', 'off')
                      and is_state('input_boolean.balkons_watering_pending_reference', 'on')
                      and is_state('script.balkons_watering_bounded_reference', 'off')) }}
        then:
          - stop: STOP local cancellation readback uncertain; recovery required
            error: true

automation:
  - id: balkons_bounded_watering_schedule_reference
    alias: Balkons 11:00 watering reference (INHIBITED)
    initial_state: false
    mode: single
    triggers:
      - trigger: time
        at: "11:00:00"
    conditions:
      - condition: template
        value_template: "{{ false }}"
    actions:
      - action: script.balkons_watering_bounded_reference
