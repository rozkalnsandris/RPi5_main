name: Weather data companion source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpi5-main-weather-data-companion-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Weather data companion
        run: |
          python3 ./tests/test-simple-deploy-weather-data-v1.py
          python3 ./tests/test-install-simple-deploy-weather-data-v1.py
          python3 ./tests/test-reconcile-simple-deploy-weather-data-v1.py
          python3 -m py_compile \
            ./ops/lib/deploy_executor/simple_deploy_weather_data_v1.py \
            ./scripts/install-simple-deploy-weather-data-v1.py \
            ./scripts/reconcile-simple-deploy-weather-data-v1.py
