name: Phase 5 Deals Access inventory diagnostic

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-phase5-deals-access-inventory-diagnostic
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact owner Deals Access inventory diagnostic
    if: github.event.issue.pull_request == null && github.event.issue.number == 897 && startsWith(github.event.comment.body, '/rpi5-p5-deals-access-inventory diagnose ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      expected_sha: ${{ steps.authorize.outputs.expected_sha }}
      canary: ${{ steps.authorize.outputs.canary }}
      issue_number: ${{ steps.authorize.outputs.issue_number }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
      trigger_actor: ${{ steps.authorize.outputs.trigger_actor }}

    steps:
      - name: Checkout default-branch authorizer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact owner diagnostic command
        id: authorize
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/github_phase5_deals_access_inventory_diagnostic_bridge.py

  diagnose:
    name: Run GET-only P1D03/P1D04 Access inventory diagnostic
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact authorized main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.authorize.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compare read-only Access inventory visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P5_DEALS_ACCESS_DIAG_EXPECTED_SHA: ${{ needs.authorize.outputs.expected_sha }}
          P5_DEALS_ACCESS_DIAG_CANARY: ${{ needs.authorize.outputs.canary }}
          CLOUDFLARE_P1D03_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_P1D03_ACCOUNT_ID }}
          CLOUDFLARE_P1D03_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D03_READ_API_TOKEN }}
          CLOUDFLARE_P1D04_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_P1D04_ACCOUNT_ID }}
          CLOUDFLARE_P1D04_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D04_READ_API_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 scripts/cloudflare_phase5_deals_access_inventory_diagnostic_actions.py
