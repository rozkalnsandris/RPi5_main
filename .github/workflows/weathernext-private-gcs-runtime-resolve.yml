name: WeatherNext private GCS auth runtime resolver

on:
  pull_request:
    paths:
      - ".github/workflows/weathernext-private-gcs-runtime-resolve.yml"

permissions:
  contents: read

jobs:
  resolve-closure-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve public PyPI GCS auth-runtime closure proposal
        run: |
          set -euo pipefail
          rm -rf .weathernext-private-gcs-auth-runtime-proposal
          mkdir -p .weathernext-private-gcs-auth-runtime-proposal/wheelhouse
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys
          import zipfile
          from email.parser import Parser

          roots = (
              "google-auth>=2.59.1,<3",
              "obstore>=0.11.1,<0.12",
              "requests>=2.34.2,<3",
              "xarray>=2026.9,<2027",
              "zarr>=3.4,<4",
          )
          platforms = (
              "manylinux_2_28_aarch64",
              "manylinux_2_27_aarch64",
              "manylinux_2_26_aarch64",
              "manylinux_2_25_aarch64",
              "manylinux_2_24_aarch64",
              "manylinux_2_23_aarch64",
              "manylinux_2_22_aarch64",
              "manylinux_2_21_aarch64",
              "manylinux_2_20_aarch64",
              "manylinux_2_19_aarch64",
              "manylinux_2_18_aarch64",
              "manylinux_2_17_aarch64",
              "manylinux2014_aarch64",
          )
          build = pathlib.Path(".weathernext-private-gcs-auth-runtime-proposal")
          wheelhouse = build / "wheelhouse"
          command = [
              sys.executable,
              "-m",
              "pip",
              "download",
              "--disable-pip-version-check",
              "--only-binary=:all:",
          ]
          for platform in platforms:
              command.extend(["--platform", platform])
          command.extend(
              [
                  "--python-version",
                  "313",
                  "--implementation",
                  "cp",
                  "--abi",
                  "cp313",
                  "--abi",
                  "abi3",
                  "--dest",
                  str(wheelhouse),
                  *roots,
              ]
          )
          subprocess.run(command, check=True)

          def canonical(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).lower()

          packages = []
          for path in sorted(wheelhouse.glob("*.whl")):
              with zipfile.ZipFile(path, "r") as archive:
                  metadata_names = [
                      name
                      for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_names) != 1:
                      raise SystemExit(f"unexpected METADATA count for {path.name}")
                  metadata = Parser().parsestr(
                      archive.read(metadata_names[0]).decode("utf-8")
                  )
              name = canonical(metadata["Name"])
              version = metadata["Version"]
              if not name or not version:
                  raise SystemExit(f"missing package metadata for {path.name}")
              packages.append(
                  {
                      "name": name,
                      "version": version,
                      "filename": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )

          packages.sort(key=lambda item: item["name"])
          if len({item["name"] for item in packages}) != len(packages):
              raise SystemExit("duplicate canonical package name")
          names = {item["name"] for item in packages}
          required_roots = {"google-auth", "obstore", "requests", "xarray", "zarr"}
          if not required_roots.issubset(names):
              raise SystemExit("required root package missing")
          if "google-cloud-bigquery" in names:
              raise SystemExit("BigQuery package is forbidden in GCS runtime closure")

          projected = [
              {
                  "name": item["name"],
                  "version": item["version"],
                  "filename": item["filename"],
                  "sha256": item["sha256"],
              }
              for item in packages
          ]
          closure_sha256 = hashlib.sha256(
              json.dumps(
                  projected,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
          ).hexdigest()
          versions = {item["name"]: item["version"] for item in packages}
          proposal = {
              "schema": "rozkalns-weather.weathernext-private-gcs-runtime-lock.v1",
              "operation_id": "rozkalns-weather.weathernext-private-gcs-runtime-materialization.v1",
              "weather_source_sha": "1fc7ea70efde88cb826c2e4a0baf26925078375c",
              "weather_extra": "weathernext-gcs",
              "upstream_requirements": list(roots),
              "resolved_roots": {
                  "google-auth": versions["google-auth"],
                  "obstore": versions["obstore"],
                  "requests": versions["requests"],
                  "xarray": versions["xarray"],
                  "zarr": versions["zarr"],
              },
              "target": {
                  "os": "linux",
                  "architecture": "aarch64",
                  "python_version": "3.13",
                  "python_abi": "cp313",
                  "pip_platform": "manylinux_2_28_aarch64",
                  "accepted_abi": ["cp313", "abi3", "none"],
                  "accepted_wheel_platforms": list(platforms),
              },
              "package_count": len(packages),
              "closure_sha256": closure_sha256,
              "packages": packages,
              "provenance": {
                  "registry": "https://pypi.org/simple",
                  "resolver": "pip download public proposal",
                  "resolved_at": "2026-10-02",
              },
              "live_network_install_allowed": False,
              "live_package_manager_install_allowed": False,
              "credential_material_in_lock": False,
              "private_google_identity_in_lock": False,
          }
          print("GCS_AUTH_RUNTIME_LOCK_PROPOSAL_BEGIN")
          print(json.dumps(proposal, sort_keys=True, separators=(",", ":")))
          print("GCS_AUTH_RUNTIME_LOCK_PROPOSAL_END")
          PY
