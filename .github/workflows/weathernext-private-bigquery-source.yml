name: WeatherNext private BigQuery source

on:
  pull_request:
    paths:
      - "ops/lib/deploy_executor/weather_private_bigquery_contract.py"
      - "tests/test-deploy-executor-weather-private-bigquery.py"
      - "docs/WEATHERNEXT_PRIVATE_BIGQUERY_SOURCE.md"
      - ".github/workflows/weathernext-private-bigquery-source.yml"
  push:
    branches:
      - main
    paths:
      - "ops/lib/deploy_executor/weather_private_bigquery_contract.py"
      - "tests/test-deploy-executor-weather-private-bigquery.py"
      - "docs/WEATHERNEXT_PRIVATE_BIGQUERY_SOURCE.md"
      - ".github/workflows/weathernext-private-bigquery-source.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate private WeatherNext source boundary
        run: |
          python3 ./tests/test-deploy-executor-weather-private-bigquery.py
          python3 -m py_compile ops/lib/deploy_executor/weather_private_bigquery_contract.py
