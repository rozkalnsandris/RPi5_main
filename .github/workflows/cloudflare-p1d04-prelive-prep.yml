name: Cloudflare P1D-04 pre-LIVE prep

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-p1d04-prelive-prep
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact owner P1D-04 pre-LIVE prep command
    if: github.event.issue.pull_request == null && github.event.issue.number == 179 && startsWith(github.event.comment.body, '/rpi5-p1d04 prep ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    outputs:
      expected_sha: ${{ steps.authorize.outputs.expected_sha }}
      canary: ${{ steps.authorize.outputs.canary }}
      issue_number: ${{ steps.authorize.outputs.issue_number }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
      trigger_actor: ${{ steps.authorize.outputs.trigger_actor }}

    steps:
      - name: Checkout default-branch authorizer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact issue, owner, canary and SHA-bound prep command
        id: authorize
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/github_p1d04_prelive_prep_bridge.py

  prepare:
    name: Build private GET-only Organization preimage evidence
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact authorized main source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.authorize.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run exact GET-only P1D-04 pre-LIVE prep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P1D04_PRELIVE_EXPECTED_SHA: ${{ needs.authorize.outputs.expected_sha }}
          P1D04_PRELIVE_CANARY: ${{ needs.authorize.outputs.canary }}
          CLOUDFLARE_P1D04_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_P1D04_ACCOUNT_ID }}
          CLOUDFLARE_P1D04_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D04_READ_API_TOKEN }}
          CLOUDFLARE_P1D04_WRITE_API_TOKEN: ${{ secrets.CLOUDFLARE_P1D04_WRITE_API_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 scripts/cloudflare_owner_browser_sso_prelive_prep_actions.py
